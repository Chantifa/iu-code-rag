name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-all-MiniLM-L6-v2
      - name: Install (CPU torch)
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.2"
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Golden + similarity tests
        run: pytest -v
      - name: Golden evaluation report (fixtures)
        run: iu-rag evaluate --fixtures --k 5

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t iu-code-rag:ci .
      - name: Run tests inside the image
        run: docker run --rm -e LLM_PROVIDER=none iu-code-rag:ci sh -c "pip install pytest && pytest -q"
