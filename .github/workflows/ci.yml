name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-all-MiniLM-L6-v2
      - name: Install (CPU torch)
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.2"
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Golden + similarity tests
        run: pytest -v
      - name: Golden evaluation report (fixtures)
        run: iu-rag evaluate --fixtures --k 5

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker-compose file
        run: docker compose config -q
      - name: Build image
        run: docker build -t iu-code-rag:ci .
      - name: Run tests inside the image
        run: docker run --rm -e LLM_PROVIDER=none iu-code-rag:ci sh -c "pip install -q pytest && pytest -q"
      - name: End-to-end smoke test (ingest two real repos, query the API)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p data
          docker run --rm -e LLM_PROVIDER=none -e GITHUB_TOKEN -v "$PWD/data:/app/data" iu-code-rag:ci \
            iu-rag ingest --repo Chantifa/Interviews --repo iubh/DLBCSL01_DataStructures_and_Algorithms
          docker run -d --name rag -p 8000:8000 -e LLM_PROVIDER=none -v "$PWD/data:/app/data" iu-code-rag:ci
          for i in $(seq 1 45); do curl -sf localhost:8000/health >/dev/null && break; sleep 2; done
          curl -sf localhost:8000/health | tee /dev/stderr | grep -q '"index_loaded":true'
          curl -sf localhost:8000/ask -H 'content-type: application/json' \
            -d '{"question":"How does the rate limiter decide whether a request is allowed?"}' \
            | tee /dev/stderr | grep -q 'rate_limiter.py'
          docker logs rag | tail -20
          docker rm -f rag
