services:
  ollama:
    image: ollama/ollama:latest
    container_name: iu-rag-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12

  # One-shot job that pulls the chat model the first time the stack starts.
  ollama-pull:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command: ["ollama pull ${OLLAMA_MODEL:-qwen2.5-coder:1.5b}"]
    volumes:
      - ollama_models:/root/.ollama
    restart: "no"

  rag:
    build: .
    image: iu-code-rag:latest
    container_name: iu-rag-api
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5-coder:1.5b}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-opus-5}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      DATA_DIR: /app/data
      TOP_K: ${TOP_K:-6}
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./config:/app/config:ro

volumes:
  ollama_models:
