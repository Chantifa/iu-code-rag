# Repositories that get indexed by `iu-rag ingest`.
#
# type: user | org   -> lists every repository of that GitHub account
# type: repo         -> a single repository, given as owner/name
sources:
  - type: user
    name: Chantifa
    include_forks: false
    exclude:               # repository names to skip
      - iu-code-rag        # this project: its test fixtures are copies of files indexed elsewhere

  - type: org
    name: iubh
    include_forks: false
    exclude: []

# Only files with these extensions are indexed. Jupyter notebooks are
# converted to text (markdown + code cells) before chunking.
include_extensions:
  - .py
  - .ipynb
  - .java
  - .kt
  - .kts
  - .js
  - .jsx
  - .ts
  - .tsx
  - .php
  - .cs
  - .r
  - .R
  - .sql
  - .sh
  - .html
  - .css
  - .scss
  - .md
  - .rst
  - .txt
  - .yml
  - .yaml
  - .toml
  - .json
  - .xml
  - .properties
  - .gradle
  - Dockerfile

# Glob patterns (matched against the path inside the repository) to skip.
exclude_globs:
  - "**/node_modules/**"
  - "**/.git/**"
  # committed virtual environments / vendored third-party packages (iubh/DLBDSMLSL01 ships one
  # with ~7000 library files - 100 MB of noise that would dominate the index)
  - "**/site-packages/**"
  - "**/lib/python*/**"
  - "**/.venv/**"
  - "**/venv/**"
  - "**/env/**"
  - "**/.tox/**"
  - "**/dist/**"
  - "**/build/**"
  - "**/target/**"
  - "**/vendor/**"
  - "**/__pycache__/**"
  - "**/.idea/**"
  - "**/*.min.js"
  - "**/*.min.css"
  - "**/package-lock.json"
  - "**/yarn.lock"
  - "**/*.lock"
  - "**/.ipynb_checkpoints/**"
