[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "iu-code-rag"
version = "0.1.0"
description = "LangChain RAG system over Chantifa's GitHub repositories and the IU (iubh) course repositories, with local embeddings, golden tests and similarity tests."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [{ name = "Chantifa" }]
dependencies = [
    "langchain-core>=0.3",
    "langchain-community>=0.3",
    "langchain-text-splitters>=0.3",
    "langchain-huggingface>=0.1",
    "langchain-ollama>=0.2",
    "langchain-anthropic>=0.3",
    "sentence-transformers>=3.0",
    "faiss-cpu>=1.8",
    "rank-bm25>=0.2.2",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6",
    "typer>=0.12",
    "rich>=13",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5"]

[project.scripts]
iu-rag = "iu_code_rag.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "llm: tests that need a running LLM (Ollama or Anthropic); skipped automatically when none is configured",
]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"src/iu_code_rag/api.py" = ["E501"]   # inline HTML page
"src/iu_code_rag/cli.py" = ["B008"]   # typer.Option() defaults are the documented typer style
